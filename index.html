<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173f86"><meta name="description" content="公民課的建國練習：5題快速體驗或9題完整版，看看你的選擇比較像內閣制、總統制，還是混合制。"><title>如果由你建國｜政府制度配對測驗</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet"><style>/* 色彩：三種制度各一色，介面其他部分維持安靜的藍與白。 */
:root{
 --paper:#ffffff;--wash:#eef2f8;--ink:#13233b;--muted:#4a5d78;--line:#cfd9e7;
 --navy:#173f86;--navy-soft:#e3ebfb;--stamp:#c8372a;--focus:#0a7a6e;
 --parl:#1d4fb8;--pres:#c8372a;--semi:#6a3db3;
 --radius:14px;
 font-size:clamp(18px,1.1vw + 13px,22px);color-scheme:light
}
*{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:1rem;line-height:1.75;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button,a,summary,input{touch-action:manipulation}
button{cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
h1:focus{outline:none}
[hidden]{display:none!important}
a{color:var(--navy);text-underline-offset:.2em}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.35}
h3{font-size:1.05rem;margin:1.1rem 0 .35rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.minor{font-size:.85rem;color:var(--muted)}

.shell{max-width:860px;margin:0 auto;padding:clamp(1rem,4vw,2.4rem) 1rem 2.5rem}

/* 按鈕 */
.button{border:2px solid var(--navy);border-radius:10px;background:var(--navy);color:#fff;padding:.55rem 1.2rem;min-height:56px;font-weight:700;font-size:1rem;line-height:1.5}
.button.secondary{background:var(--paper);color:var(--navy)}
.button:disabled{background:#dbe3ef;border-color:#dbe3ef;color:#5d6f88}
.button:not(:disabled):hover{filter:brightness(.94)}
.actions{display:flex;gap:.7rem;justify-content:space-between;margin:1.6rem 0 0}
.actions .button{flex:0 1 auto}
.actions .button:last-child{min-width:8.5em}

/* 首頁 */
body[data-view="home"]{min-height:100svh;display:flex;flex-direction:column}
body[data-view="home"] .shell{flex:1;display:flex;align-items:center;max-width:1040px;width:100%}
.home{width:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:clamp(1rem,4vw,3rem);align-items:center}
.home h1{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:900;letter-spacing:.02em;line-height:1.3}
.home-lead{margin-top:1rem;font-size:1.05rem;color:var(--muted);max-width:26em}
.home-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.8rem}
.button.start{min-height:64px;padding:.6rem 2.4rem;font-size:1.15rem}
.home-note{margin-top:.7rem;font-size:.9rem;color:var(--muted)}
.ballot-visual{justify-self:center;width:min(100%,300px)}
.ballot-visual svg{display:block;width:100%;height:auto}
.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:.6rem 1rem}

/* 題目 */
.quiz{max-width:760px;margin:0 auto}
.quiz-top{margin-bottom:1.4rem}
.progress-text{font-weight:700;color:var(--navy);font-size:.95rem;margin-bottom:.45rem}
.progress-text span{color:var(--muted);font-weight:400}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps li{flex:1;height:8px;border-radius:4px;background:#d3dceb}
.steps li.done{background:var(--navy)}
.steps li.current{box-shadow:0 0 0 2px var(--wash),0 0 0 4px var(--navy)}
.quiz h1{font-size:clamp(1.5rem,3.4vw,2rem);font-weight:900;letter-spacing:.01em}
.stem{font-size:1.05rem;margin-top:.6rem}
.hint{margin-top:.8rem;font-size:.9rem;color:var(--muted);line-height:1.7}
.hint-label{display:inline-block;margin-right:.5em;padding:0 .45em;border-radius:5px;background:var(--navy-soft);color:var(--navy);font-weight:700}
.role-intro{margin-top:.8rem;background:var(--paper);border-radius:10px;padding:.7rem 1rem}
.role-intro p{display:grid;grid-template-columns:auto 1fr;gap:.6rem}

.options{border:0;padding:0;margin:1.2rem 0 0;min-width:0}
.option{position:relative;display:flex;align-items:flex-start;gap:.9rem;padding:.95rem 1.05rem;margin:0 0 .7rem;background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .12s,background .12s}
.option:hover{border-color:#8aa3c9}
.option input{position:absolute;opacity:0;width:1px;height:1px}
.option:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}
/* 選票方格：選取時蓋上紅色勾。 */
.box{flex:0 0 30px;width:30px;height:30px;margin-top:.1rem;border:2.5px solid var(--navy);border-radius:5px;background:var(--paper);display:grid;place-items:center}
.box svg{width:24px;height:24px;fill:none;stroke:var(--stamp);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6) rotate(-8deg);transition:opacity .12s,transform .15s}
.option.selected{border-color:var(--navy);background:var(--navy-soft)}
.option.selected .box svg{opacity:1;transform:none}
.option-copy{flex:1;min-width:0}
.option-title{display:block;font-weight:700;font-size:1.08rem;line-height:1.5}
.option-description{display:block;font-size:.93rem;color:#33496a;margin-top:.25rem;line-height:1.7}

/* 確認頁 */
.review-list{list-style:none;padding:0;margin:1.2rem 0 0;background:var(--paper);border-radius:var(--radius);overflow:hidden}
.review-row{display:flex;align-items:center;gap:1rem;padding:.85rem 1rem;border-bottom:1px solid var(--line)}
.review-row:last-child{border-bottom:0}
.review-copy{flex:1;min-width:0}
.review-title{font-size:.88rem;color:var(--muted)}
.review-answer{font-weight:700}
.edit{border:1px solid var(--line);background:var(--paper);color:var(--navy);border-radius:8px;padding:.3rem .8rem;min-height:44px;font-size:.9rem;white-space:nowrap}

/* 結果：整片制度色，學生舉起手機時全班看得到。 */
.result{max-width:760px;margin:0 auto}
.verdict{background:var(--sys);color:#fff;border-radius:20px;padding:clamp(1.3rem,4vw,2.2rem);position:relative;overflow:hidden}
.verdict.tied{background:linear-gradient(115deg,var(--sys) 0 50%,var(--sys2) 50% 100%)}
.verdict-pre{font-size:1rem;font-weight:700;opacity:.9}
.verdict-name{font-size:clamp(3.2rem,13vw,5.6rem);font-weight:900;line-height:1.1;letter-spacing:.04em;margin:.25rem 0 .9rem;animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
.verdict.tied .verdict-name{font-size:clamp(1.9rem,7.6vw,3.4rem)}
.verdict-suffix{font-size:.45em;margin-left:.15em;letter-spacing:0;opacity:.9}
.verdict-and{font-size:.5em;margin:0 .3em;opacity:.9}
.verdict-def{font-size:1.02rem;max-width:32em;line-height:1.75}
.verdict-eg{margin-top:.7rem;font-size:.9rem;font-weight:700;opacity:.9}
@keyframes stamp{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.verdict-name{animation:none}.box svg{transition:none}}

.bars{background:var(--paper);border-radius:var(--radius);padding:1rem 1.1rem;margin-top:1rem;display:grid;gap:.55rem}
.bar-row{display:grid;grid-template-columns:4.2em 1fr 3.2em;align-items:center;gap:.7rem;font-size:.95rem}
.bar-name{font-weight:700}
.bar-track{height:14px;border-radius:7px;background:#e4e9f1;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--sys);border-radius:7px}
.bar-value{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
/* 最接近的國家：大字國名加大百分比，顏色跟著該國制度。 */
.nation{margin-top:1rem;background:var(--paper);border-radius:20px;border:3px solid var(--sys);padding:clamp(1rem,3.5vw,1.6rem) clamp(1.1rem,4vw,2rem);display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:1rem}
.nation-label{font-size:.95rem;font-weight:700;color:var(--muted)}
.nation-name{white-space:nowrap;font-size:clamp(2.8rem,12vw,4.6rem);font-weight:900;line-height:1.1;letter-spacing:.06em;color:var(--ink);margin-top:.2rem}
.nation-name.multi{white-space:normal;font-size:clamp(1.9rem,8vw,3rem);letter-spacing:.02em}
.nation-score{color:var(--sys);font-weight:900;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.nation-num{font-size:clamp(3rem,13vw,5rem)}
.nation-unit{font-size:clamp(1.4rem,5vw,2rem);margin-left:.05em}
.nation-feature{grid-column:1/-1;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--line);font-size:.98rem}
.nation-tag{display:inline-block;margin-right:.55em;padding:0 .6em;border-radius:20px;background:var(--tint);color:var(--sys);font-weight:700;font-size:.82rem;line-height:1.8;vertical-align:.08em}
.think{margin-top:1rem;border-left:5px solid var(--stamp);background:var(--paper);border-radius:0 var(--radius) var(--radius) 0;padding:.85rem 1.1rem}
.think-label{font-weight:900;color:var(--stamp);font-size:.9rem}
.think p+p{margin-top:.2rem;font-size:1.08rem;font-weight:700}
.result-actions{justify-content:flex-start;margin-top:1.3rem}
.result-extras{margin-top:1.6rem;border-top:1px solid var(--line)}
.result-more{border-bottom:1px solid var(--line);padding:.7rem 0}
.result-more>summary{color:var(--navy);font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
.result-detail-body{padding:.4rem 0 .6rem;font-size:.95rem}
.result-detail-body details{margin:.4rem 0}
.result-detail-body details>summary{cursor:pointer;font-weight:700}
.result-detail-body details>p{margin:.4rem 0 .6rem 1rem}
.answer-list{padding-left:1.2rem;margin:.3rem 0}
.answer-label{font-weight:700;font-size:.88rem;color:var(--muted)}
.different{background:var(--paper);border-radius:10px;padding:.7rem .9rem;margin:.5rem 0}
.result-note{margin-top:1.2rem}

.country-rank{background:var(--paper);border-radius:12px;margin:.5rem 0;padding:.2rem .9rem}
.country-rank>summary{display:flex;align-items:center;justify-content:space-between;gap:.8rem;min-height:52px;list-style:none}
.country-rank>summary::-webkit-details-marker{display:none}
.country-summary{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.country-name{font-weight:900}
.country-type{font-size:.78rem;font-weight:700;color:var(--sys);border:1.5px solid var(--sys);border-radius:20px;padding:0 .55em;line-height:1.7}
.country-score{font-weight:900;font-variant-numeric:tabular-nums}
.country-body{padding:.3rem 0 .8rem;border-top:1px solid var(--line)}
.country-body>p:first-child{margin-top:.6rem}
.sources{padding-left:1.2rem;font-size:.85rem}

@media (max-width:640px){
 .home{grid-template-columns:1fr;gap:.6rem}
 .ballot-visual{grid-row:1;width:clamp(96px,24svh,150px);justify-self:start}
 .actions .button{flex:1}
 .bar-row{grid-template-columns:3.8em 1fr 2.8em;gap:.5rem}
}
/* 手機與平板：國家卡緊接在制度卡後面。 */
@media (max-width:899px){
 .result-grid{display:flex;flex-direction:column}
 .result-main,.result-side{display:contents}
 .verdict{order:1}.nation{order:2}.bars{order:3}.think{order:4}.result-actions{order:5}
}
.nowrap{white-space:nowrap}
@media print{body{background:#fff}.actions,.footer{display:none}}

/* 電腦版：題目三個選項並排成一列選票；結果頁左右兩欄。 */
@media (min-width:900px){
 .shell{max-width:1180px;padding:2.4rem 2rem 3rem}
 body[data-view="home"] .shell{max-width:1120px}
 .home h1{font-size:3.2rem}
 .ballot-visual{width:min(100%,340px)}

 .quiz{max-width:1120px}
 .quiz-top{max-width:560px;margin-bottom:1.8rem}
 .question-head{max-width:44em}
 .quiz h1{font-size:2.3rem}
 .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;margin-top:1.8rem}
 .option{flex-direction:column;gap:.9rem;margin:0;padding:1.4rem 1.35rem 1.5rem}
 .box{flex-basis:auto}
 .option-title{font-size:1.2rem}
 .option-description{margin-top:.4rem}
 .actions{margin-top:2.2rem}
 .actions .button{min-width:10em}

 .review{max-width:900px}
 .review-list{display:grid;grid-template-columns:1fr 1fr}
 .review-row{border-right:1px solid var(--line)}
 .review-row:nth-child(2n){border-right:0}
 .review-row:last-child:nth-child(odd){grid-column:1/-1;border-right:0}

 .result{max-width:1120px}
 .result-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.4rem}
 .result-main{display:flex;flex-direction:column}
 .result-main .verdict{flex:1;display:flex;flex-direction:column;justify-content:center}
 .nation{margin-top:0}
 .verdict-name{font-size:4.4rem;white-space:nowrap}
 .verdict-name{font-size:clamp(3.4rem,5.4vw,4.4rem)}
 .verdict.tied .verdict-name{font-size:clamp(1.9rem,3.2vw,2.5rem);white-space:normal}
 .nation-name{font-size:clamp(2.6rem,4.4vw,3.8rem)}
 .nation-name.multi{font-size:clamp(1.8rem,3vw,2.4rem)}
 .nation-num{font-size:clamp(3rem,5vw,4.4rem)}
 .result-actions .button{flex:1}
 .result-extras{margin-top:2.2rem}
 .result-detail-body{columns:2;column-gap:1.4rem}
 .result-detail-body>*{break-inside:avoid}
 .result-detail-body h3:first-of-type{margin-top:.4rem}
}
@media (min-width:900px) and (max-height:760px){
 .shell{padding-top:1.6rem}
 .quiz h1{font-size:2rem}
 .options{margin-top:1.3rem}
 .actions{margin-top:1.5rem}
 .option{padding:1.1rem 1.2rem 1.2rem}
 .quiz-top{margin-bottom:1.2rem}
}

]], "source_ids": ["UK1", "DE1", "US1", "KR1", "FR1", "TW1"], "help": "這裡說的是「不信任案」：國會投票表示不再支持內閣。違法時的「彈劾」是另一回事。"}, {"id": "Q5", "title": "政府和國會僵持不下，可以提前改選國會嗎？", "stem": "", "options": [{"id": "A", "label": "可以，由總理請求", "text": "交給選民裁決。有的國家隨時可以，有的只限特殊情況，例如被倒閣之後。"}, {"id": "B", "label": "可以，由總統決定", "text": "總統出面打破僵局；但總統也可能為了自己的政治利益這樣做。"}, {"id": "C", "label": "不行，做滿任期", "text": "雙方只能繼續協商，僵局可能拖很久。"}], "weight": 14, "topic": "解散國會與政治僵局", "lecture_pages": [35, 36, 37, 53, 62, 88, 89, 114, 115], "explanation": "解散國會是讓議員提前改選。英國可由首相請求；德國、臺灣只限特殊情況，例如臺灣須先通過不信任案，行政院院長才能呈請總統解散立法院；法國總統可依憲法解散國民議會；美國、南韓總統沒有這個權限。", "partial_matches": [["A", "B", 0.5]], "source_ids": ["UK1", "DE1", "US1", "KR1", "FR1", "TW1"], "help": "「解散國會」是讓議員提前改選、由選民重新決定，不是取消國會。"}, {"id": "Q6", "title": "國會議員可以同時當部長嗎？", "stem": "", "options": [{"id": "A", "label": "可以，部長多是議員", "text": "政府和國會比較好溝通；但議員等於要監督自己參與的政府。"}, {"id": "B", "label": "可以，也能找非議員", "text": "選人更有彈性；兼任的人一樣會遇到角色衝突。"}, {"id": "C", "label": "不行，只能二選一", "text": "做事和監督分給不同的人；但政府和國會需要更多協調。"}], "weight": 10, "topic": "職務融合與職務分立", "lecture_pages": [29, 52, 84, 104, 105], "explanation": "英國、日本等國的部會首長主要由議員擔任；德國、丹麥等國允許兼任，也可任命非議員。臺灣、美國等國不兼任；瑞典則由替補議員行使職務，不一定須辭去議員資格。", "partial_matches": [["A", "B", 0.5]], "source_ids": ["UK1", "DE1", "US1", "KR1", "FR1", "TW1", "KR2"], "help": "部長負責執行政策，議員負責立法與監督政府。"}], "countries": [{"id": "uk", "name": "英國", "system": "內閣制", "profile": {"Q1": "A", "Q2": "A", "Q4": "A", "Q5": "A", "Q6": "A"}, "feature": "政府以維持下議院信任為基礎，元首主要代表國家。下議院採一輪相對多數選舉，上議院主要以任命等方式組成。", "tradeoff": "國會多數與內閣若高度一致，政策較容易推動，也需要有效的反對黨及其他監督。", "discussion": "當政府掌握國會多數時，你認為哪些監督仍然必要？", "sources": ["UK1", "UK2", "UK3", "UK4", "UKPET"], "notes": "君主仍有形式及特定保留權限；避免說元首完全沒有任何憲法權限。解散下議院須依現行憲政程序。", "short_feature": "由總理與內閣負責施政，政府須維持國會信任。元首主要代表國家。", "group": "parl"}, {"id": "de", "name": "德國", "system": "內閣制", "profile": {"Q1": "A", "Q2": "B", "Q4": "B", "Q5": "A", "Q6": "B"}, "feature": "總理由聯邦議院選出。國會須同時選出繼任者，才能透過建設性不信任投票撤換總理；邦政府透過聯邦參議院參與中央立法。", "tradeoff": "更換政府須形成替代多數，能減少只反對而無接任方案的情形，但也提高撤換門檻。", "discussion": "如果多數議員不喜歡現任總理，卻無法同意繼任者，你接受政府繼續執政嗎？", "sources": ["DE1", "DE2", "DE3", "DE4", "DEPET"], "notes": "聯邦參議院是代表邦政府的特殊機關。德國選制以政黨票決定席次比例，不能直接等同臺灣並立制。", "short_feature": "總理由國會選出。撤換總理時，國會須同時選出接任者。", "group": "parl"}, {"id": "us", "name": "美國", "system": "總統制", "profile": {"Q1": "B", "Q2": "C", "Q4": "C", "Q5": "C", "Q6": "C"}, "feature": "總統領導行政，與國會分別有民意授權和固定任期。總統沒有解散國會權，國會不能用普通不信任案撤換總統；重要行政任命須經參議院同意。", "tradeoff": "行政與國會多數意見不同時，分權提供制衡，也可能導致協商困難與政治僵局。", "discussion": "你願意維持雙方固定任期，即使行政與國會長期不同調嗎？", "sources": ["US1", "US2"], "notes": "部會首長在總統領導下行使行政職權，不能說成完全沒有行政權。國會聽證與調查不等於內閣制的信任責任。眾議院選制各州有少數例外。", "short_feature": "總統領導行政，與國會分別對人民負責。國會不能用不信任案讓總統下臺。", "group": "pres"}, {"id": "kr", "name": "南韓", "system": "總統制", "profile": {"Q1": "B", "Q2": "C", "Q4": "C", "Q5": "C", "Q6": "B"}, "feature": "民選總統領導行政，國務總理由總統任命並須經國會同意。總統五年一任不得連任；國會一院制，議員可兼任總理或國務委員。", "tradeoff": "單任期能限制總統連續執政，但也沒有連任選舉讓選民決定是否給現任總統第二任。", "discussion": "只做一任的總統，應透過哪些機制向選民與國會負責？", "sources": ["KR1", "KR2", "KR3", "KRPET"], "notes": "南韓有政府提案、國會質詢與兼任安排，不能套用美國全部細節。國會撤換建議不等於具有強制效果的不信任案。", "short_feature": "民選總統領導行政，國務總理協助。總理任命須經國會同意。", "group": "pres"}, {"id": "fr", "name": "法國", "system": "混合制／半總統制", "profile": {"Q1": "C", "Q2": "C", "Q4": "A", "Q5": "B", "Q6": "C"}, "feature": "民選總統與總理並存，政府須向國會負責。總統在憲法限制下可解散國民議會，無須先有倒閣；兩院並存，國民議會採兩輪選舉。", "tradeoff": "總統與國會多數立場不同時，總統和總理的互動需要調整；雙首長安排本身不保證權責清楚或政治合作。", "discussion": "如果你支持的總統必須與另一陣營的總理合作，你會如何評價？", "sources": ["FR1", "FR2", "FR3", "FRRIP"], "notes": "總理由總統任命，政府須面對國會不信任，但不必固定先取得上任信任投票。不能說任何情況都必須由席次最多政黨組閣。", "short_feature": "民選總統與總理分擔行政工作，政府須向國會負責。", "group": "semi"}, {"id": "tw", "name": "臺灣", "system": "混合制／雙首長制", "profile": {"Q1": "C", "Q2": "C", "Q4": "A", "Q5": "A", "Q6": "C"}, "feature": "總統民選並任命行政院院長，上任無須立法院事先同意。行政院向立法院負責；立法院通過不信任案後，行政院院長得呈請總統解散立法院。", "tradeoff": "行政院院長須面對立法院的政治責任，但任命權在總統，可能產生雙重負責及權責辨識的問題。", "discussion": "總統任命的人選與立法院多數不同調時，你希望由誰調整或讓步？", "sources": ["TW1", "TW2", "TWREF"], "notes": "總統不能因一般政策衝突主動解散立法院；倒閣通過也不表示一定解       const details=questions.map(q=>{
        const raw=country.profile[q.id];
        // 合併後的選項（例如Q4德國）以target_map對應。
        const target=q.target_map?.[raw]||raw;
        const similarity=match(q,answers[q.id],target,country.id);
        return {question:q,choice:q.options.find(o=>o.id===answers[q.id]),target:q.options.find(o=>o.id===target),similarity,points:q.weight*similarity,lost:q.weight*(1-similarity)};
      });
      const raw=details.reduce((sum,d)=>sum+d.points,0)/total*100;
      return {country,details,raw,percent:Math.round(raw)};
    }).sort((a,b)=>b.raw-a.raw||a.country.id.localeCompare(b.country.id));
    const top=results[0].raw;
    // 制度傾向：各制度組內取最高的國家分數比較，不累加國家數。
    const systems=data.systems.map(sys=>{
      const best=results.find(r=>r.country.group===sys.id);
      return {system:sys,score:best.raw,percent:best.percent,best};
    });
    const order=[...systems].sort((a,b)=>b.score-a.score);
    const topSystems=order.filter(s=>Math.abs(s.score-order[0].score)<1e-9);
    return {results,systems,topSystems,winners:results.filter(r=>Math.abs(r.raw-top)<1e-9)};
  }
  const engine={match,calculate};
  if(typeof module!=='undefined'&&module.exports)module.exports=engine;
  else root.QuizEngine=engine;
})(typeof window!=='undefined'?window:globalThis);

(function(){
'use strict';
const data=QUIZ_DATA;
const key='government-quiz-'+data.version;
const root=document.getElementById('app');
const engine=QuizEngine;
let answers={},index=0,view='home',returnToReview=false;
const questions=()=>data.questions;
try{
 const saved=JSON.parse(sessionStorage.getItem(key)||'null');
 if(saved?.answers){
  for(const q of questions()){if(q.options.some(o=>o.id===saved.answers[q.id]))answers[q.id]=saved.answers[q.id];}
  index=Math.min(questions().length-1,Math.max(0,Number(saved.index)||0));
 }
}catch{}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const optionText=o=>`${escape(o.label||'')}：${escape(o.text)}`;
const completed=()=>questions().every(q=>answers[q.id]);
const count=()=>questions().filter(q=>answers[q.id]).length;
function save(){try{sessionStorage.setItem(key,JSON.stringify({answers,index}));}catch{}}
function focusTitle(){requestAnimationFrame(()=>{root.querySelector('h1')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});});}
function navigate(to){view=to;render();focusTitle();}
const check='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12.5l5 5L19.5 6"/></svg>';
function sourceLinks(country){return `<ul class="sources">${country.sources.map(id=>{const s=data.sources[id];return s?`<li><a href="${escape(s.url)}" target="_blank" rel="noopener noreferrer">${escape(s.title)}</a></li>`:'';}).join('')}</ul>`;}

function home(){
 const started=count()>0;
 root.innerHTML=`<section class="home">
  <div class="home-copy">
   <h1 tabindex="-1">如果由你建國，<br>你會選哪一種政府？</h1>
   <p class="home-lead">回答幾個關於政府規則的問題，看看你的選擇比較像內閣制、總統制，還是混合制。</p>
   <div class="home-actions">
    <button class="button start" data-action="start">${started?(completed()?'查看我的結果':'接著作答'):'開始投票'}</button>
    ${started?'<button class="button secondary" data-action="reset">重新開始</button>':''}
   </div>
   <p class="home-note">共 ${questions().length} 題，約 3 分鐘</p>
  </div>
  <div class="ballot-visual" aria-hidden="true"><svg viewBox="0 0 360 390" focusable="false"><path d="M47 207L160 153L311 214L199 277Z" fill="#e5efff" stroke="#173f86" stroke-width="5"/><path d="M47 207V314L198 372V277Z" fill="#173f86" stroke="#173f86" stroke-width="5"/><path d="M198 277V372L311 309V214Z" fill="#b7ceee" stroke="#173f86" stroke-width="5"/><path d="M118 220L225 253" stroke="#173f86" stroke-width="9" stroke-linecap="round"/><g transform="rotate(-14 181 140)"><path d="M106 39H250V215H106Z" fill="#fff" stroke="#173f86" stroke-width="5"/><path d="M125 65H165V105H125Z" fill="none" stroke="#173f86" stroke-width="4"/><path d="M128 81L142 97L174 58" fill="none" stroke="#c8372a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 78H231M125 133H231M125 158H215M125 184H231" stroke="#173f86" stroke-width="5" stroke-linecap="round"/></g><circle cx="279" cy="82" r="35" fill="#c8372a"/><path d="M262 81L275 94L297 67" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 </section>`;
}

function steps(){
 const qs=questions();
 return `<ol class="steps" aria-label="作答進度">${qs.map((q,i)=>`<li class="${answers[q.id]?'done':''} ${i===index?'current':''}"><span class="sr-only">第${i+1}題${answers[q.id]?'，已作答':''}</span></li>`).join('')}</ol>`;
}

function question(){
 const qs=questions(),q=qs[index];
 root.innerHTML=`<section class="quiz">
  <div class="quiz-top"><p class="progress-text">第 ${index+1} 題<span>／共 ${qs.length} 題</span></p>${steps()}</div>
  <div class="question-head">
   <h1 id="question-title" tabindex="-1">${escape(q.title)}</h1>
   ${q.stem?`<p class="stem" id="question-stem">${escape(q.stem)}</p>`:''}
   ${q.help?`<p class="hint" id="question-help"><span class="hint-label">小提醒</span>${escape(q.help)}</p>`:''}
  </div>
  <fieldset class="options" aria-labelledby="question-title" ${q.stem||q.help?`aria-describedby="${q.stem?'question-stem ':''}${q.help?'question-help':''}"`:''}>
   <legend class="sr-only">請選一個答案</legend>
   ${q.options.map(o=>`<label class="option ${answers[q.id]===o.id?'selected':''}"><input type="radio" name="${q.id}" value="${o.id}" ${answers[q.id]===o.id?'checked':''}><span class="box">${check}</span><span class="option-copy"><span class="option-title">${escape(o.label)}</span><span class="option-description">${escape(o.text)}</span></span></label>`).join('')}
  </fieldset>
  <div class="actions">
   <button class="button secondary" data-action="previous">${index===0?'回到首頁':'上一題'}</button>
   <button class="button" data-action="next" ${answers[q.id]?'':'disabled'}>${returnToReview?'回到確認頁':index===qs.length-1?'確認我的答案':'下一題'}</button>
  </div>
 </section>`;
}

function review(){
 root.innerHTML=`<section class="quiz review">
  <h1 tabindex="-1">這是你的建國方案</h1>
  <p class="stem">看一下，有沒有想改的地方？</p>
  <ol class="review-list">${questions().map((q,i)=>{const o=q.options.find(o=>o.id===answers[q.id]);return `<li class="review-row"><div class="review-copy"><p class="review-title">${i+1}. ${escape(q.title)}</p><p class="review-answer">${o?escape(o.label):'還沒作答'}</p></div><button class="edit" data-action="edit" data-index="${i}" aria-label="修改第${i+1}題">修改</button></li>`;}).join('')}</ol>
  <div class="actions"><button class="button secondary" data-action="last">上一題</button><button class="button" data-action="result" ${completed()?'':'disabled'}>揭曉結果</button></div>
 </section>`;
}

function matched(result){return result.details.filter(d=>d.similarity===1).sort((a,b)=>b.question.weight-a.question.weight).slice(0,3);}
function differences(result){return result.details.filter(d=>d.similarity<1).sort((a,b)=>b.lost-a.lost).slice(0,2);}
function systemOf(country){return data.systems.find(s=>s.id===country.group);}
function rankCard(r,top){
 const c=r.country,sys=systemOf(c);
 return `<details class="country-rank"><summary><span class="country-summary"><span class="country-name">${escape(c.name)}</span><span class="country-type" style="--sys:${sys.color}">${escape(c.system)}</span></span><span class="country-score">${r.percent}%</span></summary>
  <div class="country-body"><p>${escape(c.feature)}</p><h3>需要一起考慮的事</h3><p>${escape(c.tradeoff)}</p><h3>想一想</h3><p>${escape(c.discussion)}</p>
  <details><summary>我的選擇與${escape(c.name)}的差異</summary>${differences(r).map(d=>`<div class="different"><p class="answer-label">${escape(d.question.title)}</p><p>你選：${optionText(d.choice)}</p><p>${escape(c.name)}：${optionText(d.target)}</p></div>`).join('')||`<p>你的每個選擇都和${escape(c.name)}在本測驗中的設定相同。</p>`}</details>
  <details><summary>制度細節與資料來源</summary><p>${escape(c.notes)}</p>${sourceLinks(c)}</details></div></details>`;
}

function result(){
 let scored;
 try{scored=engine.calculate(data,answers);}catch{navigate('review');return;}
 const top=scored.results[0],c=top.country;
 const tiedSystems=scored.topSystems.length>1;
 const lead=scored.topSystems[0].system;
 const nearest=scored.winners.map(r=>`<span class="nowrap">${escape(r.country.name)}</span>`).join('、');
 const card=tiedSystems
  ?`<div class="verdict tied" style="--sys:${scored.topSystems[0].system.color};--sys2:${scored.topSystems[1].system.color};--tint:${lead.tint}">
     <p class="verdict-pre">你的建國方案介於</p>
     <p class="verdict-name"><span class="nowrap">${escape(scored.topSystems[0].system.name)}<span class="verdict-and">和</span></span><span class="nowrap">${escape(scored.topSystems[1].system.name)}<span class="verdict-suffix">之間</span></span></p>
     <p class="verdict-def">你的選擇同時具有兩種制度的特色，可以想想哪一題讓它們分不出高下。</p>
    </div>`
  :`<div class="verdict" style="--sys:${lead.color};--tint:${lead.tint}">
     <p class="verdict-pre">你的建國方案屬於</p>
     <p class="verdict-name">${escape(lead.name)}<span class="verdict-suffix">派</span></p>
     <p class="verdict-def">${escape(lead.definition)}</p>
     <p class="verdict-eg">代表國家：${escape(lead.examples)}</p>
    </div>`;
 const topSys=systemOf(c);
 const countryCard=`<div class="nation" style="--sys:${topSys.color};--tint:${topSys.tint}">
   <div class="nation-main">
    <p class="nation-label">最接近的國家</p>
    <p class="nation-name${scored.winners.length>1?' multi':''}">${nearest}</p>
   </div>
   <p class="nation-score"><span class="nation-num">${top.percent}</span><span class="nation-unit">%</span></p>
   <p class="nation-feature">${scored.winners.length>1?'這幾個國家和你的選擇一樣接近，可以在下方「比較6個國家」展開看看。':`<span class="nation-tag">${escape(c.system)}</span>${escape(c.short_feature||c.feature)}`}</p>
  </div>`;
 const bars=`<div class="bars" role="list" aria-label="三種制度的相似程度">${scored.systems.map(s=>`<div class="bar-row" role="listitem" style="--sys:${s.system.color}"><span class="bar-name">${escape(s.system.name)}</span><span class="bar-track"><span class="bar-fill" style="width:${s.percent}%"></span></span><span class="bar-value">${s.percent}%</span></div>`).join('')}</div>`;
 root.innerHTML=`<section class="result">
  <h1 class="sr-only" tabindex="-1">結果：${tiedSystems?scored.topSystems.map(s=>escape(s.system.name)).join('和')+'之間':escape(lead.name)+'派'}</h1>
  <div class="result-grid">
   <div class="result-main">
    ${card}
    ${tiedSystems?'':`<div class="think"><p class="think-label">想一想</p><p>${escape(lead.think)}</p></div>`}
   </div>
   <div class="result-side">
    ${countryCard}
    ${bars}
    <div class="actions result-actions"><button class="button secondary" data-action="review">修改答案</button><button class="button secondary" data-action="reset">再玩一次</button></div>
   </div>
  </div>
  <div class="result-extras">
   <details class="result-more"><summary>為什麼最接近${escape(c.name)}？</summary><div class="result-detail-body">
    ${scored.winners.length>1?`<p class="minor">你和${nearest}的相似程度相同，以下先以${escape(c.name)}說明。</p>`:''}
    <h3>和${escape(c.name)}相同的選擇</h3>
    <ul class="answer-list">${matched(top).map(d=>`<li><p class="answer-label">${escape(d.question.title)}</p><p>${escape(d.choice.label)}</p></li>`).join('')||'<li>你的答案多為部分接近，可以從下方差異開始比較。</li>'}</ul>
    <h3>不一樣的地方</h3>
    ${differences(top).map(d=>`<div class="different"><p class="answer-label">${escape(d.question.title)}</p><p><strong>你選：</strong>${escape(d.choice.label)}</p><p><strong>${escape(c.name)}：</strong>${escape(d.target.label)}</p></div>`).join('')||`<p>你的每個選擇都和${escape(c.name)}在本測驗中的設定相同。</p>`}
   </div></details>
   <details class="result-more"><summary>比較${scored.results.length}個國家</summary><div class="result-detail-body">${scored.results.map(r=>rankCard(r,top.raw)).join('')}</div></details>
   <details class="result-more"><summary>查看各題解析</summary><div class="result-detail-body">${questions().map(q=>`<details><summary>${escape(q.title)}</summary><p>${escape(q.explanation)}</p></details>`).join('')}</div></details>
  </div>
  <p class="minor result-note">百分比是你的選擇和各國制度設定的相似程度，用來引起討論，不是性向測驗。各國制度都有例外，請搭配課本一起看。</p>
 </section>`;
}

function render(){document.body.dataset.view=view;document.querySelector('.footer').hidden=view!=='home';if(view==='home')home();else if(view==='question')question();else if(view==='review')review();else result();}

root.addEventListener('change',event=>{
 if(!event.target.matches('input[type=radio]'))return;
 const q=questions()[index];answers[q.id]=event.target.value;save();
 root.querySelectorAll('.option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));
 root.querySelector('[data-action=next]').disabled=false;
 root.querySelectorAll('.steps li')[index]?.classList.add('done');
});
root.addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
 switch(button.dataset.action){
  case 'start':returnToReview=false;if(completed())navigate('result');else{index=questions().findIndex(q=>!answers[q.id]);navigate('question');}break;
  case 'reset':answers={};index=0;returnToReview=false;save();navigate('home');break;
  case 'previous':returnToReview=false;if(index===0)navigate('home');else{index--;save();navigate('question');}break;
  case 'next':if(returnToReview||index===questions().length-1){returnToReview=false;navigate('review');}else{index++;save();navigate('question');}break;
  case 'last':index=questions().length-1;returnToReview=false;navigate('question');break;
  case 'edit':index=Number(button.dataset.index);returnToReview=true;navigate('question');break;
  case 'result':navigate('result');break;
  case 'review':navigate('review');break;
 }
});
render();
})();
</script></body></html>
