<body><main id="app" class="shell"></main><footer class="footer"><p>資料查核：2026年10月</p></footer><noscript><p>請開啟瀏覽器的JavaScript功能，才能進行互動測驗。</p></noscript><script>const QUIZ_DATA={"version": "2.2", "checked_date": "2026-10-12", "title": "你的理想政府，最接近哪一國？", "subtitle": "你心中的政府，最接近哪個國家？", "intro": "12題，選出你想要的政治規則。", "questions": [{"id": "Q1", "title": "你希望政府怎麼分工？", "stem": "", "options": [{"id": "A", "text": "元首可以是國王或總統，為象徵角色。總理帶領內閣處理政務，並向國會負責。", "label": "元首代表國家，總理負責施政"}, {"id": "B", "text": "總統同時擔任國家元首與行政首長，領導行政團隊。即使另設總理也是協助總統。", "label": "總統代表國家，並主導施政"}, {"id": "C", "text": "總統擁有實際行政權力，總理也帶領內閣處理政務。總理與內閣須向國會負責。", "label": "總統代表國家，與總理分擔施政"}], "weight": 18, "topic": "行政權歸屬", "lecture_pages": [20, 23, 47, 73, 80, 83], "explanation": "內閣制由總理帶領內閣，向國會負責；總統制由總統主導行政；混合制由總統與總理分擔行政。不能只看有幾位首長，還要看實際權力與責任。", "partial_matches": [["A", "C", 0.5], ["B", "C", 0.5]], "source_ids": ["UK1", "DE1", "JP1", "CA1", "AU1", "SE2", "DK2", "US1", "KR1", "FR1", "PT1", "TW1"], "help": "「元首」代表國家，可能是國王或總統；「施政」是規劃並執行政策。總理帶領由部長組成的內閣。"}, {"id": "Q2", "title": "你希望元首如何產生？", "stem": "代表國家的人，可以透過不同方式產生。", "options": [{"id": "A", "text": "由王室成員依繼承規則擔任元首，權力受到憲法限制。", "label": "保留世襲君主"}, {"id": "B", "text": "由國會或其他民意代表機構選出元首。", "label": "由民意代表選出"}, {"id": "C", "text": "由全國選民直接投票選出元首。", "label": "全民直接選舉"}, {"id": "D", "text": "各地選民先選出選舉人，再由選舉人選出元首。", "label": "由選舉人間接選出"}], "weight": 10, "topic": "元首產生與人民主權", "lecture_pages": [19, 45, 46, 74, 95], "explanation": "元首如何產生，與是否掌握行政實權是兩件事。德國總統由聯邦大會選出；美國採選舉人團；法國、葡萄牙、臺灣及南韓採直接選舉。", "partial_matches": [["B", "C", 0.5], ["C", "D", 0.5], ["B", "D", 0.5]], "source_ids": ["UK1", "DE1", "JP1", "CA1", "AU1", "SE2", "DK2", "US1", "KR1", "FR1", "PT1", "TW1"], "help": ""}, {"id": "Q3", "title": "你希望如何決定行政團隊的人選？", "stem": "國會對總理或各部會首長的人選，應有多大的決定權？", "options": [{"id": "A", "label": "以國會支持為基礎", "text": "總理由國會選出，或由能獲得國會支持的人擔任。"}, {"id": "B", "label": "總統提名，國會同意", "text": "總統提出總理或各部會首長人選，經國會同意後任命。"}, {"id": "C", "label": "總統任命，不須事先同意", "text": "總統直接任命總理或各部會首長，上任不需要先經國會同意。"}], "weight": 14, "topic": "內閣形成與正當性來源", "lecture_pages": [21, 22, 23, 48, 74, 81, 82, 83], "explanation": "行政人選可由國會選出、以國會支持為基礎，或由總統任命。美國部會首長須經參議院同意；南韓總理須經國會同意；臺灣行政院長不須事先取得立法院同意。上任程序與上任後的監督不同。", "partial_matches": [["A", "B", 0.5], ["B", "C", 0.5]], "source_ids": ["UK1", "DE1", "JP1", "CA1", "AU1", "SE2", "DK2", "US1", "KR1", "FR1", "PT1", "TW1"], "help": "上任不須國會事先同意，不代表上任後不受國會監督。", "country_overrides": {"fr": {"A": 1, "B": 0.5, "C": 0.5}, "pt": {"A": 1, "B": 0.5, "C": 0.5}}}, {"id": "Q4", "title": "你希望國會如何制衡行政團隊？", "stem": "行政團隊沒有違法，但國會多數議員已不支持它的施政。國會可以怎麼做？", "options": [{"id": "A", "label": "可以要求下臺，接任人選另依程序決定", "text": "國會可通過不信任案，要求內閣下臺，不必在表決時同時選出新總理。"}, {"id": "B", "label": "可以要求下臺，須同時選出接任者", "text": "國會須在通過不信任案的同時選出新總理，才能撤換現任總理。"}, {"id": "C", "label": "不能以不信任案要求下臺，改以其他方式監督", "text": "國會無不信任案的設計，僅可透過其他方式制衡政府。"}], "weight": 14, "topic": "政治責任與倒閣", "lecture_pages": [31, 32, 33, 53, 57, 87, 88], "explanation": "不信任案用來追究施政責任，彈劾另有法律事由。德國須同時選出新總理才能倒閣；美國、南韓沒有同樣的倒閣機制。混合制中，內閣下臺不代表總統也下臺。", "partial_matches": [["A", "B", 0.5]], "source_ids": ["UK1", "DE1", "JP1", "CA1", "AU1", "SE2", "DK2", "US1", "KR1", "FR1", "PT1", "TW1"], "help": "「不信任案」是國會表決是否繼續支持內閣的程序，與違法時的彈劾不同。"}, {"id": "Q5", "title": "你希望如何規定解散國會的權限？", "stem": "行政團隊與國會僵持不下，哪一種作法比較能接受？", "options": [{"id": "A", "label": "總理或政府可以推動解散", "text": "政府可推動國會改選，尋求選民支持；但也可能挑選對自己有利的選舉時機。"}, {"id": "B", "label": "只有特定情況，才能解散", "text": "只有符合憲法規定的特殊情況時才能啟動，例如：組閣失敗或不信任案通過。"}, {"id": "C", "label": "總統可以推動解散", "text": "總統可推動國會改選，尋求化解僵局；但也可能為了自身政治利益推動改選。"}, {"id": "D", "label": "不能因僵局解散國會", "text": "國會完成原定任期，雙方繼續協商；但政策僵局可能長期無法解決。"}], "weight": 14, "topic": "解散國會與政治僵局", "lecture_pages": [35, 36, 37, 53, 62, 88, 89, 114, 115], "explanation": "解散國會是讓議員提前改選。英國等國可由政府推動；法國、葡萄牙總統須依法行使。臺灣須先通過不信任案，才有解散立法院的機制；美國、南韓總統無此權限。", "partial_matches": [["A", "B", 0.5], ["A", "C", 0.5], ["B", "C", 0.5]], "source_ids": ["UK1", "DE1", "JP1", "CA1", "AU1", "SE2", "DK2", "US1", "KR1", "FR1", "PT1", "TW1"], "help": "「解散國會」是提前結束議員任期，讓選民重新選出國會，不是取消國會。"}, {"id": "Q6", "title": "你希望如何安排議員與部會首長的職務？", "stem": "部會首長負責執行政策，國會議員負責立法與監督。兩種職務應怎麼安排？", "options": [{"id": "A", "label": "可以兼任，部會首長主要由議員擔任", "text": "部會首長主要從國會議員中選出，並保留議員職務，有助於政府與國會溝通；但兼任者也可能需要監督自己參與的政府。"}, {"id": "B", "label": "可以兼任，部會首長人選不限於議員", "text": "部會首長可由議員兼任，也可由國會以外的人擔任，保留選才彈性；但兼任者仍可能面臨施政與監督的角色衝突。"}, {"id": "C", "label": "不得兼任，須辭去或暫停行使議員職務", "text": "議員出任部會首長時，須辭去或暫停行使議員職務，讓施政與監督由不同的人負責；但政府與國會的協調可能需要更多安排。"}], "weight": 10, "topic": "職務融合與職務分立", "lecture_pages": [29, 52, 84, 104, 105], "explanation": "英國、日本等國的部會首長主要由議員擔任；德國、丹麥等國允許兼任，也可任命非議員。臺灣、美國等國不兼任；瑞典則由替補議員行使職務，不一定須辭去議員資格。", "partial_matches": [["A", "B", 0.5]], "source_ids": ["UK1", "DE1", "JP1", "CA1", "AU1", "SE2", "DK2", "US1", "KR1", "FR1", "PT1", "TW1", "KR2"], "help": ""}, {"id": "Q7", "title": "你希望人民如何提出立法主張？", "stem": "人民想改變法律時，哪一種提案途徑比較能接受？", "options": [{"id": "A", "label": "透過民意代表提出", "text": "人民向議員表達訴求，再由議員正式提案。"}, {"id": "B", "label": "連署達標後，交國會審議", "text": "人民可提出法律案，是否通過仍由國會決定。"}, {"id": "C", "label": "連署達標後，交全民投票", "text": "符合規定的提案由選民投票決定；可提案的事項依制度限制。"}], "weight": 6, "topic": "人民參與立法與直接民主", "lecture_pages": [], "explanation": "代表提案、人民連署及公投可並存。葡萄牙允許人民連署提出法律案；臺灣立法原則公投通過後，仍須研擬法律案、送立法院審議。請願或國會討論，不等於人民直接立法。", "partial_matches": [], "source_ids": ["UKPET", "DEPET", "JPET", "CAPET", "AUPET", "SELAW", "DKCIT", "US1", "KRPET", "FRRIP", "PTCIT", "TWREF", "PT1", "KR1", "DE1", "FR1"], "help": "三種途徑可能並存；本題比較全國層級。連署達標不代表法律自動通過。", "country_overrides": {"pt": {"A": 1, "B": 1, "C": 0.5}, "tw": {"A": 1, "B": 0.5, "C": 1}, "dk": {"A": 1, "B": 0.5, "C": 0}, "kr": {"A": 1, "B": 0.5, "C": 0}, "fr": {"A": 1, "B": 0, "C": 0.5}}}, {"id": "Q8", "title": "你希望中央與地方如何分配權力？", "stem": "中央與地方可能對同一項政策有不同主張，政策決定權應如何安排？", "options": [{"id": "A", "label": "由中央主導政策決定", "text": "中央決定主要政策，地方依共同規則執行；規則較一致，但較難照顧各地差異。"}, {"id": "B", "label": "讓地方決定較多政策", "text": "地方有較大的政策決定權，中央處理共同事務；能回應地方需求，但全國政策可能不一致。"}, {"id": "C", "label": "先按事務性質分配權限", "text": "依事務性質決定由中央或地方負責；可按事項分工，但可能產生權限歸屬爭議。"}], "weight": 7, "topic": "垂直分權延伸", "lecture_pages": [132, 133, 134, 135, 147, 148], "explanation": "中央主導重視共同規則，地方自主重視在地需求；均權原則依事務性質分配權限，不是各分一半。各國通常結合多種安排，單一制不等於完全中央集權，地方自主也不必然是聯邦制。", "partial_matches": [["A", "B", 0.5], ["A", "C", 0.5], ["B", "C", 0.5]], "source_ids": ["UK1", "DE1", "JP1", "CA1", "AU1", "SE2", "DK2", "US1", "KR1", "FR1", "PT1", "TW1", "TW111", "SELOCAL", "TW2"], "help": "本題比較誰有權決定政策，不是只問由誰執行。"}, {"id": "Q9", "title": "你希望國會議員如何選出？", "stem": "選國會議員時，地方代表與政黨代表應如何安排？", "options": [{"id": "A", "label": "以選區候選人為主", "text": "選民選出自己選區的議員，重視地方代表；各黨的總席次比例可能與得票比例有落差。"}, {"id": "B", "label": "以政黨得票比例為主", "text": "依政黨得票分配席次，再依制度決定當選人，重視政黨支持的比例；議員與特定地方的連結依選區及名單設計而異。"}, {"id": "C", "label": "結合選區與政黨名單", "text": "一部分議員由選區選出，一部分依政黨票分配席次，同時安排地方與政黨代表；兩部分的席次如何計算，各國不同。"}], "weight": 7, "topic": "選舉制度延伸", "lecture_pages": [], "explanation": "選區代表由選民選出地方候選人，政黨名單依得票比例分配席次，兩者也可結合。臺灣區域與不分區立委的產生方式不同，但都參與全國立法與監督；各國混合選制的算法不一定相同。", "partial_matches": [["A", "C", 0.5], ["B", "C", 0.5]], "source_ids": ["UK2", "DE4", "JP2", "CA2", "AU3", "SE3", "DK3", "US1", "KR3", "FR2", "PT3", "TW1", "TWCEC"], "help": "以臺灣為例：區域立委票選候選人；不分區的政黨票選政黨，再依規定分配名單席次。另有原住民立委。"}], "countries": [{"id": "uk", "name": "英國", "system": "內閣制", "profile": {"Q1": "A", "Q2": "A", "Q3": "A", "Q4": "A", "Q5": "A", "Q6": "A", "Q7": "A", "Q8": "B", "Q9": "A"}, "feature": "政府以維持下議院信任為基礎，元首主要代表國家。下議院採一輪相對多數選舉，上議院主要以任命等方式組成。", "tradeoff": "國會多數與內閣若高度一致，政策較容易推動，也需要有效的反對黨及其他監督。", "discussion": "當政府掌握國會多數時，你認為哪些監督仍然必要？", "sources": ["UK1", "UK2", "UK3", "UK4", "UKPET"], "notes": "君主仍有形式及特定保留權限；避免說元首完全沒有任何憲法權限。解散下議院須依現行憲政程序。 人民立法參與：全國請願達門檻可獲考慮安排辯論，不等於人民正式提出法律案。", "short_feature": "由總理與內閣負責施政，政府須維持國會信任。元首主要代表國家。"}, {"id": "de", "name": "德國", "system": "內閣制", "profile": {"Q1": "A", "Q2": "B", "Q3": "A", "Q4": "B", "Q5": "B", "Q6": "B", "Q7": "A", "Q8": "B", "Q9": "C"}, "feature": "總理由聯邦議院選出。國會須同時選出繼任者，才能透過建設性不信任投票撤換總理；邦政府透過聯邦參議院參與中央立法。", "tradeoff": "更換政府須形成替代多數，能減少只反對而無接任方案的情形，但也提高撤換門檻。", "discussion": "如果多數議員不喜歡現任總理，卻無法同意繼任者，你接受政府繼續執政嗎？", "sources": ["DE1", "DE2", "DE3", "DE4", "DEPET"], "notes": "聯邦參議院是代表邦政府的特殊機關。德國選制以政黨票決定席次比例，不能直接等同臺灣並立制。 人民立法參與：聯邦請願可促成議會處理；地方人民倡議不直接當成全國法律提案權。", "short_feature": "總理由國會選出。撤換總理時，國會須同時選出接任者。"}, {"id": "jp", "name": "日本", "system": "內閣制", "profile": {"Q1": "A", "Q2": "A", "Q3": "A", "Q4": "A", "Q5": "A", "Q6": "A", "Q7": "A", "Q8": "A", "Q9": "C"}, "feature": "天皇為國家與國民統合的象徵，行政權屬內閣。首相由國會議員中選出，多數部長須為議員；國會兩院均由選民選出。", "tradeoff": "首相與內閣須維持國會信任；政黨支持與議院關係會影響政策推動，制度本身不保證政黨輪替或行政效率。", "discussion": "由議員擔任部長，會讓政策更容易推動，還是讓監督更困難？", "sources": ["JP1", "JP2", "JPET"], "notes": "眾議院一般解散實務不只限於第69條不信任情形。第7條涉及天皇在內閣建議與承認下的國事行為。 人民立法參與：人民可透過議員介紹提出請願，與議員或內閣正式提出法律案不同。", "short_feature": "天皇主要代表國家，首相帶領內閣施政，政府向國會負責。"}, {"id": "ca", "name": "加拿大", "system": "內閣制", "profile": {"Q1": "A", "Q2": "A", "Q3": "A", "Q4": "A", "Q5": "A", "Q6": "A", "Q7": "A", "Q8": "B", "Q9": "A"}, "feature": "政府須維持下議院信任，元首由總督代表行使相關職能。採聯邦架構；下議院直接選舉，參議院透過任命產生。", "tradeoff": "聯邦與兩院架構提供不同層次的代表與審議，也需要處理中央地方協調及非民選上議院的正當性問題。", "discussion": "你接受由任命產生的參議院審查民選下議院通過的法律嗎？", "sources": ["CA1", "CA2", "CAPET"], "notes": "少數政府可依其他政黨的支持或容忍留任，不必然組成聯合內閣。 人民立法參與：人民請願可提交下議院，與人民直接提出一般公共法律案不同。", "short_feature": "總理與內閣須維持國會信任，中央與地方採聯邦架構。"}, {"id": "au", "name": "澳洲", "system": "內閣制", "profile": {"Q1": "A", "Q2": "A", "Q3": "A", "Q4": "A", "Q5": "A", "Q6": "A", "Q7": "A", "Q8": "B", "Q9": "A"}, "feature": "政府依眾議院支持組成，採聯邦架構，兩院皆民選。眾議院使用偏好投票，參議院使用比例代表方式。", "tradeoff": "民選參議院能形成不同於眾議院的多數，提供監督，也可能增加行政立法協商與預算衝突。", "discussion": "你希望政府受到另一個民選議院的強力監督，即使政策可能變慢嗎？", "sources": ["AU1", "AU2", "AU3", "AUPET"], "notes": "參議院不能以普通不信任案直接取代眾議院的信任角色，但預算供給權很重要。1975年事件等保留權爭議不放入基本配對題。 人民立法參與：人民可向聯邦國會請願，不因此取得全國法律案或公投的直接啟動權。", "short_feature": "總理依國會支持組成政府，兩個議院都由選民選出。"}, {"id": "se", "name": "瑞典", "system": "內閣制", "profile": {"Q1": "A", "Q2": "A", "Q3": "A", "Q4": "A", "Q5": "A", "Q6": "C", "Q7": "A", "Q8": "B", "Q9": "B"}, "feature": "國王主要代表國家。國會以多數未反對的程序確認總理；採一院制與比例代表選舉，部長任職期間由替補者行使其議員職務。", "tradeoff": "多黨與少數政府可以反映較多立場，但政策與組閣仍可能需要持續協商。", "discussion": "如果沒有過半議員支持，但也沒有過半議員反對，你接受這位總理上任嗎？", "sources": ["SE1", "SE2", "SE3", "SE4", "SELAW"], "notes": "瑞典依然是內閣制，職務不兼行不會自行將它變成總統制。額外選舉不改變原定例行選舉日期。 人民立法參與：全國法律提案由政府或議員提出；人民表達訴求不等於正式提案。", "short_feature": "國會確認總理人選，政府須維持國會信任；國王主要代表國家。"}, {"id": "dk", "name": "丹麥", "system": "內閣制", "profile": {"Q1": "A", "Q2": "A", "Q3": "A", "Q4": "A", "Q5": "A", "Q6": "B", "Q7": "A", "Q8": "B", "Q9": "B"}, "feature": "政府只要沒有國會多數反對即可留任；部長可兼任議員，也可來自國會之外。採一院制與比例代表選舉。", "tradeoff": "政府可能以跨黨協商或少數政府方式推動政策，談判能納入不同意見，但也需要付出協調成本。", "discussion": "你希望少數政府能先上任，再逐案尋求國會支持嗎？", "sources": ["DK1", "DK2", "DK3", "DKCIT"], "notes": "格陵蘭與法羅群島有自治安排，不能把非聯邦概括成所有地區由中央統一決定。丹麥部長多為議員，但法律沒有要求必須如此。 人民立法參與：人民提案取得5萬支持後，可由議員正式提出決議案；不是人民直接提交完整法律案。", "short_feature": "總理帶領政府，只要沒有國會多數反對，就能維持執政。"}, {"id": "us", "name": "美國", "system": "總統制", "profile": {"Q1": "B", "Q2": "D", "Q3": "B", "Q4": "C", "Q5": "D", "Q6": "C", "Q7": "A", "Q8": "B", "Q9": "A"}, "feature": "總統領導行政，與國會分別有民意授權和固定任期。總統沒有解散國會權，國會不能用普通不信任案撤換總統；重要行政任命須經參議院同意。", "tradeoff": "行政與國會多數意見不同時，分權提供制衡，也可能導致協商困難與政治僵局。", "discussion": "你願意維持雙方固定任期，即使行政與國會長期不同調嗎？", "sources": ["US1", "US2"], "notes": "部會首長在總統領導下行使行政職權，不能說成完全沒有行政權。國會聽證與調查不等於內閣制的信任責任。眾議院選制各州有少數例外。 人民立法參與：此處比較聯邦層級；部分州的人民創制與公投不代表聯邦也有相同制度。", "short_feature": "總統領導行政，與國會分別對人民負責。國會不能用不信任案讓總統下臺。"}, {"id": "kr", "name": "南韓", "system": "總統制", "profile": {"Q1": "B", "Q2": "C", "Q3": "B", "Q4": "C", "Q5": "D", "Q6": "B", "Q7": "A", "Q8": "A", "Q9": "C"}, "feature": "民選總統領導行政，國務總理由總統任命並須經國會同意。總統五年一任不得連任；國會一院制，議員可兼任總理或國務委員。", "tradeoff": "單任期能限制總統連續執政，但也沒有連任選舉讓選民決定是否給現任總統第二任。", "discussion": "只做一任的總統，應透過哪些機制向選民與國會負責？", "sources": ["KR1", "KR2", "KR3", "KRPET"], "notes": "南韓有政府提案、國會質詢與兼任安排，不能套用美國全部細節。國會撤換建議不等於具有強制效果的不信任案。 人民立法參與：國會連署請願可交議會處理，但不等於人民正式提出法律案。", "short_feature": "民選總統領導行政，國務總理協助。總理任命須經國會同意。"}, {"id": "fr", "name": "法國", "system": "混合制／半總統制", "profile": {"Q1": "C", "Q2": "C", "Q3": "A", "Q4": "A", "Q5": "C", "Q6": "C", "Q7": "A", "Q8": "A", "Q9": "A"}, "feature": "民選總統與總理並存，政府須向國會負責。總統在憲法限制下可解散國民議會，無須先有倒閣；兩院並存，國民議會採兩輪選舉。", "tradeoff": "總統與國會多數立場不同時，總統和總理的互動需要調整；雙首長安排本身不保證權責清楚或政治合作。", "discussion": "如果你支持的總統必須與另一陣營的總理合作，你會如何評價？", "sources": ["FR1", "FR2", "FR3", "FRRIP"], "notes": "總理由總統任命，政府須面對國會不信任，但不必固定先取得上任信任投票。不能說任何情況都必須由席次最多政黨組閣。 人民立法參與：共同倡議須先有國會議員提案，再取得選民支持；不是人民單獨連署就必然舉行公投。", "short_feature": "民選總統與總理分擔行政工作，政府須向國會負責。"}, {"id": "pt", "name": "葡萄牙", "system": "混合制／半總統制", "profile": {"Q1": "C", "Q2": "C", "Q3": "A", "Q4": "A", "Q5": "C", "Q6": "C", "Q7": "B", "Q8": "A", "Q9": "B"}, "feature": "總統由人民直接選出，任命總理時須考量國會選舉結果；政府向國會承擔政治責任。採一院制與比例代表選舉，總統有附帶憲法條件的解散權。", "tradeoff": "行政安排要同時處理民選總統的憲法職能與國會對政府的政治責任，組閣及解散仍須遵守程序。", "discussion": "你希望總統任命總理時，必須多大程度受到國會選舉結果限制？", "sources": ["PT1", "PT2", "PT3", "PTCIT"], "notes": "總統不能只因一般政策分歧任意罷免政府；憲法對政府免職有特定條件。其總統角色與法國相異，不將兩國解散、免職權視為完全一致。 人民立法參與：至少2萬名登記選民可提出符合規定的法律案，由國會審議。人民公投倡議另有國會及總統程序。", "short_feature": "民選總統任命總理時，須考量國會選舉結果；政府向國會承擔政治責任。"}, {"id": "tw", "name": "臺灣", "system": "混合制／雙首長制", "profile": {"Q1": "C", "Q2": "C", "Q3": "C", "Q4": "A", "Q5": "B", "Q6": "C", "Q7": "C", "Q8": "C", "Q9": "C"}, "feature": "總統民選並任命行政院院長，上任無须立法院事先同意。行政院向立法院負責；立法院通過不信任案後，行政院院長得呈請總統解散立法院。", "tradeoff": "行政院院長須面對立法院的政治責任，但任命權在總統，可能產生雙重負責及權責辨識的問題。", "discussion": "總統任命的人選與立法院多數不同調時，你希望由誰調整或讓步？", "sources": ["TW1", "TW2", "TWREF"], "notes": "總統不能因一般政策衝突主動解散立法院；倒閣通過也不表示一定解散。分類依講義，學術分類用語可有差異。均權原則另在中央地方單元說明。 人民立法參與：立法原則公投通過後仍須研擬法律案、送立法院審議，不能說全民直接通過完整法律條文。", "short_feature": "總統任命行政院院長，行政院向立法院負責。立法院可以提出不信任案。"}], "sources": {"UK1": {"title": "英國國會：政府與國會、信任關係", "url": "https://www.parliament.uk/about/how/role/relations-with-other-institutions/parliament-government/"}, "UK2": {"title": "英國國會：下議院選舉制度", "url": "https://www.parliament.uk/about/how/elections-and-voting/voting-systems/"}, "UK3": {"title": "英國上議院圖書館：現行成員資料", "url": "https://lordslibrary.parliament.uk/house-of-lords-data-dashboard-membership-of-the-house/"}, "UK4": {"title": "英國國會：政府法案", "url": "https://www.parliament.uk/about/how/laws/bills/public/"}, "DE1": {"title": "德國國會：基本法，第54、63、66、67、68、76條", "url": "https://www.bundestag.de/parlament/a (function(root){
  'use strict';
  function match(question,choice,target,countryId){
    const overrides=question.country_overrides?.[countryId];
    if(overrides&&Object.prototype.hasOwnProperty.call(overrides,choice))return overrides[choice];
    if(choice===target) return 1;
    const pair=question.partial_matches.find(([a,b])=>(a===choice&&b===target)||(a===target&&b===choice));
    return pair?pair[2]:0;
  }
  function calculate(data,answers){
    for(const q of data.questions){
      if(!q.options.some(o=>o.id===answers[q.id])) throw new Error('請先完成所有題目。');
    }
    const results=data.countries.map(country=>{
      const details=data.questions.map(q=>{
        const target=country.profile[q.id];
        const similarity=match(q,answers[q.id],target,country.id);
        return {question:q,choice:q.options.find(o=>o.id===answers[q.id]),target:q.options.find(o=>o.id===target),similarity,points:q.weight*similarity,lost:q.weight*(1-similarity)};
      });
      const raw=details.reduce((sum,d)=>sum+d.points,0);
      return {country,details,raw,percent:Math.round(raw),core:details.slice(0,6).reduce((sum,d)=>sum+d.points,0)};
    }).sort((a,b)=>b.raw-a.raw||a.country.id.localeCompare(b.country.id));
    const top=results[0].raw;
    return {results,winners:results.filter(r=>r.raw===top),near:results.filter(r=>top-r.raw<=5),mixed:top<60};
  }
  const engine={match,calculate};
  if(typeof module!=='undefined'&&module.exports)module.exports=engine;
  else root.QuizEngine=engine;

const count=()=>Object.keys(answers).length;
function save(){try{sessionStorage.setItem(key,JSON.stringify({answers,index}));}catch{}}
function focusTitle(){requestAnimationFrame(()=>{root.querySelector('h1')?.focus();window.scrollTo({top:0,behavior:'instant'});});}
function navigate(to){view=to;render();focusTitle();}
function sourceLinks(country){return `<ul class="sources">${country.sources.map(id=>{const s=data.sources[id];return `<li><a href="${escape(s.url)}" target="_blank" rel="noopener noreferrer">${escape(s.title)}</a></li>`;}).join('')}</ul>`;}
function home(){
root.innerHTML=`<section class="intro election-hero"><div class="election-copy"><h1 tabindex="-1">你的理想政府，<br>最接近哪一國？</h1><p class="hero-description">投下你的選擇，打造心中的理想政府。</p><div class="intro-actions"><button class="button" data-action="start">${count()?(completed()?'查看我的結果':'接著作答'):'開始投票'}</button>${count()?'<button class="button secondary" data-action="reset">重新開始</button>':''}</div></div><div class="ballot-visual" aria-hidden="true"><svg viewBox="0 0 360 390" focusable="false"><path d="M47 207L160 153L311 214L199 277Z" fill="#e5efff" stroke="#173f86" stroke-width="5"/><path d="M47 207V314L198 372V277Z" fill="#173f86" stroke="#173f86" stroke-width="5"/><path d="M198 277V372L311 309V214Z" fill="#b7ceee" stroke="#173f86" stroke-width="5"/><path d="M118 220L225 253" stroke="#173f86" stroke-width="9" stroke-linecap="round"/><g transform="rotate(-14 181 140)"><path d="M106 39H250V215H106Z" fill="#fff" stroke="#173f86" stroke-width="5"/><path d="M125 65H165V105H125Z" fill="none" stroke="#173f86" stroke-width="4"/><path d="M128 81L142 97L174 58" fill="none" stroke="#cf3d3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 78H231M125 133H231M125 158H215M125 184H231" stroke="#173f86" stroke-width="5" stroke-linecap="round"/></g><circle cx="279" cy="82" r="35" fill="#cf3d3d"/><path d="M262 81L275 94L297 67" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div></section>`;
}
function question(){
 const q=data.questions[index];
 root.innerHTML=`<section class="quiz"><div class="progress-text"><span>第 ${index+1} 題，共 ${data.questions.length} 題</span><span>已完成 ${count()} 題</span></div><div class="progress-track" role="progressbar" aria-label="已完成題數" aria-valuemin="0" aria-valuemax="${data.questions.length}" aria-valuenow="${count()}"><div class="progress-fill" style="width:${count()/data.questions.length*100}%"></div></div><div class="question"><h1 id="question-title" tabindex="-1">${escape(q.title)}</h1>${q.role_intro?`<div class="role-intro" aria-label="先認識兩個角色">${q.role_intro.map(r=>`<p><strong>${escape(r.label)}</strong><span>${escape(r.description)}</span></p>`).join('')}</div>`:''}${q.stem?`<p class="stem" id="question-stem">${escape(q.stem)}</p>`:''}${q.help?`<details class="helper question-helper" id="question-help" open><summary>小提醒</summary><p>${escape(q.help)}</p></details>`:""}<fieldset class="options" aria-labelledby="question-title" aria-describedby="${q.stem?'question-stem ':''}${q.help?'question-help':''}"><legend class="sr-only">請選一個答案</legend>${q.options.map(o=>`<label class="option ${answers[q.id]===o.id?'selected':''}"><input type="radio" name="${q.id}" value="${o.id}" ${answers[q.id]===o.id?'checked':''}><span class="option-copy"><span class="option-title">${escape(o.label)}</span><span class="option-description">${escape(o.text)}</span></span></label>`).join('')}</fieldset><div class="actions"><button class="button secondary" data-action="previous">${index===0?'回到首頁':'上一題'}</button><button class="button" data-action="next" ${answers[q.id]?'':'disabled'}>${returnToReview?'返回確認答案':index===data.questions.length-1?'確認我的答案':'下一題'}</button></div></div></section>`;
}
function review(){
root.innerHTML=`<section class="quiz review"><h1 tabindex="-1">這是你選的建國規則</h1><p class="stem">看一下，有沒有想改的地方？</p><ol class="review-list">${data.questions.map((q,i)=>{const o=q.options.find(o=>o.id===answers[q.id]);return `<li class="review-row"><div class="review-copy"><p class="review-title">${i+1}. ${escape(q.title)}</p><p class="review-answer">${o?optionText(o):'還沒作答'}</p></div><button class="edit" data-action="edit" data-index="${i}" aria-label="修改第${i+1}題">修改</button></li>`;}).join('')}</ol><div class="actions"><button class="button secondary" data-action="last">回到上題</button><button class="button" data-action="result" ${completed()?'':'disabled'}>揭曉配對</button></div></section>`;
}
function matched(result){return result.details.filter(d=>d.similarity===1).sort((a,b)=>b.question.weight-a.question.weight).slice(0,3);}
function differences(result){return result.details.filter(d=>d.similarity<1).sort((a,b)=>b.lost-a.lost).slice(0,2);}
function rankCard(r,top){const c=r.country;return `<details class="country-rank"><summary><span class="country-summary">${escape(c.name)}<span class="country-type">${escape(c.system)}${r.raw===top?'，最高配對':top-r.raw<=5?'，相近配對':''}</span></span><span class="country-score">${r.percent}%</span></summary><div class="country-body"><p>${escape(c.feature)}</p><h3>需要一起考慮的事</h3><p>${escape(c.tradeoff)}</p><h3>想一想</h3><p>${escape(c.discussion)}</p><details><summary>我的選擇與這個國家的差異</summary>${differences(r).map(d=>`<div class="different"><p class="answer-label">${escape(d.question.title)}</p><p>你選：${optionText(d.choice)}</p><p>${escape(c.name)}的安排：${optionText(d.target)}</p></div>`).join('')||'<p>你選的${data.questions.length}項規則，都符合這個國家在本測驗中的設定。</p>'}</details><details><summary>制度細節與資料來源</summary><p>${escape(c.notes)}</p>${sourceLinks(c)}</details></div></details>`;}
function result(){
 let scored;
 try{scored=QuizEngine.calculate(data,answers);}catch{navigate('review');return;}
 const top=scored.results[0],c=top.country;
 const tied=scored.winners.length>1;
 const heading=tied
  ?`你與${scored.winners.map(r=>escape(r.country.name)).join('、')}<br>同樣適合，各 <span class="percentage">${top.percent}%</span>`
  :`你有 <span class="percentage">${top.percent}%</span><br>適合${escape(c.name)}！`;
 const summary=tied?'你的選擇接近多個國家。展開「比較12個國家」，可以查看各個並列配對。':c.short_feature||c.feature;
 root.innerHTML=`<section class="result result-compact">
  <div class="result-heading">
   <h1 tabindex="-1">${heading}</h1>
   <p class="result-subtitle">${tied?'並列配對':escape(c.system)}</p>
   <p>${escape(summary)}</p>
   ${scored.mixed?'<p class="minor">你的偏好結合了多種制度，這是相對最接近的配對。</p>':''}
  </div>
  <div class="section-actions compact-actions">
   <button class="button" data-action="review">修改答案</button>
   <button class="button secondary" data-action="reset">重新開始</button>
  </div>
  <div class="result-extras">
   <details class="result-more">
    <summary>${tied?'查看配對原因與差異':'為什麼配對到'+escape(c.name)+'？'}</summary>
    <div class="result-detail-body">
     ${tied?'<p class="minor">以下先以'+escape(c.name)+'說明，其他並列國家可在國家比較中展開。</p>':''}
     <h3>與你相同的選擇</h3>
     <ul class="answer-list">${matched(top).map(d=>`<li><p class="answer-label">${escape(d.question.title)}</p><p>${optionText(d.choice)}</p></li>`).join('')||'<li>你的答案多為部分接近，可以從下方差異開始比較。</li>'}</ul>
     <h3>仍有差異的地方</h3>
     ${differences(top).map(d=>`<div class="different"><p class="answer-label">${escape(d.question.title)}</p><p><strong>你選：</strong>${optionText(d.choice)}</p><p><strong>${escape(c.name)}：</strong>${optionText(d.target)}</p></div>`).join('')||'<p>你選的${data.questions.length}項規則，都符合這個國家在本測驗中的設定。</p>'}
     <h3>需要一起考慮的事</h3><p>${escape(c.tradeoff)}</p>
    </div>
   </details>
   <details class="result-more" id="country-comparison">
    <summary>比較12個國家</summary>
    <div class="result-detail-body">${scored.results.map(r=>rankCard(r,top.raw)).join('')}</div>
   </details>
   <details class="result-more explanations">
    <summary>查看各題解析</summary>
    <div class="result-detail-body">${data.questions.map(q=>`<details><summary>${escape(q.title)}</summary><p>${escape(q.explanation)}</p></details>`).join('')}</div>
   </details>
  </div>
 </section>`;
}
function render(){document.body.dataset.view=view;document.querySelector('.footer').hidden=view!=='home';if(view==='home')home();else if(view==='question')question();else if(view==='review')review();else result();}
root.addEventListener('change',event=>{if(event.target.matches('input[type=radio]')){const q=data.questions[index];answers[q.id]=event.target.value;save();root.querySelectorAll('.option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));root.querySelector('[data-action=next]').disabled=false;const progress=root.querySelector('[role=progressbar]');progress.setAttribute('aria-valuenow',count());root.querySelector('.progress-fill').style.width=count()/data.questions.length*100+'%';root.querySelector('.progress-text span:last-child').textContent='已完成 '+count()+' 題';}});
root.addEventListener('click',event=>{
const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
switch(button.dataset.action){
case 'start':returnToReview=false;if(completed())navigate('result');else{index=data.questions.findIndex(q=>!answers[q.id]);navigate('question');}break;
case 'reset':answers={};index=0;returnToReview=false;save();navigate('home');break;
case 'previous':returnToReview=false;if(index===0)navigate('home');else{index--;save();navigate('question');}break;
case 'next':if(returnToReview||index===data.questions.length-1){returnToReview=false;navigate('review');}else{index++;save();navigate('question');}break;
case 'last':index=data.questions.length-1;returnToReview=false;navigate('question');break;
case 'edit':index=Number(button.dataset.index);returnToReview=true;navigate('question');break;
case 'result':navigate('result');break;
case 'review':navigate('review');break;
case 'print':window.print();break;
}
});
render();
})();
</script></body></html>
